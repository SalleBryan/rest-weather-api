[project]
name = "rest-weather-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

description = "Local tooling (tests + template lint) for the rest-weather-api SAM project"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "boto3>=1.43.119",
    "cfn-lint>=1.58.0",
    "moto[dynamodb]>=5.2.4",
    "pytest>=9.1.1",
]
