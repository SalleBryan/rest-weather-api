AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  rest-weather-api

  A CRUDL serverless REST API built with AWS SAM, API Gateway, Lambda (Python) and DynamoDB.
  Based on the Educloud Academy course "Building a Serverless Rest Api With AWS SAM and Python".

Parameters:
  OwnerTokenSha256:
    Type: String
    NoEcho: true
    AllowedPattern: "[a-f0-9]{64}"
    Description: SHA256 digest of a private random owner token; never the token itself.

# Globals: settings every function and API in this template shares.
Globals:
  Function:
    Runtime: python3.14
    Architectures:
      - arm64                 # Graviton: ~20% cheaper per ms than x86 for the same code
    CodeUri: src/
    Timeout: 5
    MemorySize: 128
    Environment:
      Variables:
        TABLE_NAME: !Ref WeatherTable
  Api:
    Cors:                     # lets the web dashboard (web/index.html) call the API from a browser
      AllowOrigin: "'*'"
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization'"

Resources:
  # ── The front door ──────────────────────────────────────────────────────────
  WeatherApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev
      Description: serverless api for weather application
      Auth:
        DefaultAuthorizer: OwnerAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          OwnerAuthorizer:
            FunctionArn: !GetAtt OwnerAuthorizer.Arn
            FunctionPayloadType: TOKEN
            Identity:
              Header: Authorization
              ValidationExpression: '^Bearer [A-Za-z0-9_-]{43,128}$'
              ReauthorizeEvery: 300
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
      # Protect all routes and constrain authenticated traffic as well.
      # Throttles are best-effort traffic controls, not a quota or spending cap.
      # Concurrent executions are shared with other functions in the account/region.
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: 1     # steady requests per second
          ThrottlingBurstLimit: 3    # short spikes allowed above the steady rate

  OwnerAuthorizer:
    Type: AWS::Serverless::Function
    Properties:
      Handler: authorize.lambda_handler
      Environment:
        Variables:
          OWNER_TOKEN_SHA256: !Ref OwnerTokenSha256

  OwnerAuthorizerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${OwnerAuthorizer}'
      RetentionInDays: 7

  # ── The database ────────────────────────────────────────────────────────────
  WeatherTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: feedKey
          AttributeType: S
        - AttributeName: townKey
          AttributeType: S
        - AttributeName: orderKey
          AttributeType: S
      GlobalSecondaryIndexes:
        - IndexName: FeedIndex
          KeySchema:
            - AttributeName: feedKey
              KeyType: HASH
            - AttributeName: orderKey
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: TownIndex
          KeySchema:
            - AttributeName: townKey
              KeyType: HASH
            - AttributeName: orderKey
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST   # pay per request, nothing to tune, free-tier friendly

  # ── C: Create ───────────────────────────────────────────────────────────────
  CreateWeather:
    Type: AWS::Serverless::Function
    Properties:
      Description: 'Lambda function inserts weather data into DynamoDB table'
      FunctionName: CreateWeatherLambda
      Handler: create_weather.lambda_handler
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /create-weather
            Method: POST
            RestApiId: !Ref WeatherApi
    Connectors:
      addWeatherItemToDB:
        Properties:
          Destination:
            Id: WeatherTable
          Permissions:
            - Write

  # ── R: Read one ─────────────────────────────────────────────────────────────
  GetWeather:
    Type: AWS::Serverless::Function
    Properties:
      Description: 'Lambda function gets weather item in DynamoDB table'
      FunctionName: GetWeatherLambda
      Handler: get_weather.lambda_handler
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /weather/{id}
            Method: GET
            RestApiId: !Ref WeatherApi
    Connectors:
      getWeatherItemFromDB:
        Properties:
          Destination:
            Id: WeatherTable
          Permissions:
            - Read

  # ── U: Update ───────────────────────────────────────────────────────────────
  UpdateWeather:
    Type: AWS::Serverless::Function
    Properties:
      Description: 'Lambda function updates weather item in DynamoDB table'
      FunctionName: UpdateWeatherLambda
      Handler: update_weather.lambda_handler
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /weather/{id}
            Method: PUT
            RestApiId: !Ref WeatherApi
    Connectors:
      updateWeatherItemInDB:
        Properties:
          Destination:
            Id: WeatherTable
          Permissions:
            - Write
            - Read

  # ── D: Delete ───────────────────────────────────────────────────────────────
  DeleteWeather:
    Type: AWS::Serverless::Function
    Properties:
      Description: 'Lambda function deletes weather item from DynamoDB table'
      FunctionName: DeleteWeatherLambda
      Handler: delete_weather.lambda_handler
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /weather/{id}
            Method: DELETE
            RestApiId: !Ref WeatherApi
    Connectors:
      deleteWeatherItemFromDB:
        Properties:
          Destination:
            Id: WeatherTable
          Permissions:
            - Write

  # ── L: List all ─────────────────────────────────────────────────────────────
  GetAllWeather:
    Type: AWS::Serverless::Function
    Properties:
      Description: 'Lambda function gets all weather items in DynamoDB table'
      FunctionName: GetAllWeatherLambda
      Handler: get_weathers.lambda_handler
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /weathers
            Method: GET
            RestApiId: !Ref WeatherApi
        Locations:
          Type: Api
          Properties:
            Path: /locations
            Method: GET
            RestApiId: !Ref WeatherApi
    Connectors:
      getAllWeatherItemsFromDB:
        Properties:
          Destination:
            Id: WeatherTable
          Permissions:
            - Read

Outputs:
  WeatherApiUrl:
    Description: "API Gateway endpoint URL for the dev stage"
    Value: !Sub "https://${WeatherApi}.execute-api.${AWS::Region}.amazonaws.com/dev/"
  WeatherTableName:
    Description: "DynamoDB table holding the weather items"
    Value: !Ref WeatherTable
  CreateWeatherFunction:
    Description: "Create Weather Lambda Function ARN"
    Value: !GetAtt CreateWeather.Arn
  GetWeatherFunction:
    Description: "Get Weather Lambda Function ARN"
    Value: !GetAtt GetWeather.Arn
  UpdateWeatherFunction:
    Description: "Update Weather Lambda Function ARN"
    Value: !GetAtt UpdateWeather.Arn
  DeleteWeatherFunction:
    Description: "Delete Weather Lambda Function ARN"
    Value: !GetAtt DeleteWeather.Arn
  GetAllWeatherFunction:
    Description: "List Weathers Lambda Function ARN"
    Value: !GetAtt GetAllWeather.Arn
