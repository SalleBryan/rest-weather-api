customHeaders:
  - pattern: "**/*"
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: no-referrer
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(self), payment=(), usb=()
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://api.open-meteo.com https://geocoding-api.open-meteo.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      - key: Cache-Control
        value: public, max-age=0, must-revalidate
  - pattern: "workspace.html"
    headers:
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
  - pattern: "fonts/**"
    headers:
      - key: Cache-Control
        value: public, max-age=604800
  - pattern: "sw.js"
    headers:
      - key: Cache-Control
        value: no-store
